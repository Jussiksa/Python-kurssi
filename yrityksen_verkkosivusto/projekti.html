<!DOCTYPE html>
<html lang="fi">
<head>
  <!-- Perustiedot ja sama pintamaali kuin etusivulla -->
  <meta charset="UTF-8">
  <title>Novexia Holding - Projektit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Päähuone: Alaosan kortit kannettuna tänne kolmossivulle -->
  <main class="hero-cards-container">

    <!-- Kortti 1: Perheäly -->
    <div class="ecosystem-card">
      <div class="card-icon">
        <img src="assets/icons/perhealy-icon.png" alt="Perheäly App">
      </div>
      <span class="card-tag">PERHEÄLY</span>
      <h3 class="card-title">PERHEÄLY APP</h3>
      <p class="card-subtitle">Kognitiivinen Tulkkaus</p>
    </div>

    <!-- Kortti 2: Novexia Labs -->
    <div class="ecosystem-card">
      <div class="card-icon">
        <img src="assets/icons/labs-icon.png" alt="Novexia Labs">
      </div>
      <h3 class="card-title">NOVEXIA LABS</h3>
      <p class="card-subtitle">AI & LLM R&D</p>
    </div>

    <!-- Kortti 3: Sijoittajille -->
    <div class="ecosystem-card">
      <div class="card-icon">
        <img src="assets/icons/investors-icon.png" alt="Sijoittajille">
      </div>
      <h3 class="card-title">SIJOITTAJILLE</h3>
      <p class="card-subtitle">Kasvua & Innovaatiota</p>
    </div>

  </main>

</body>
</html>
